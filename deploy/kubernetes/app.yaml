apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-career-copilot-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-career-copilot
  labels:
    app.kubernetes.io/name: ai-career-copilot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-career-copilot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-career-copilot
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: ghcr.io/mzatylny/ai_career_copilot:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: ai-career-copilot
            - secretRef:
                name: ai-career-copilot-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ai-career-copilot-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-career-copilot
spec:
  selector:
    app.kubernetes.io/name: ai-career-copilot
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-career-copilot
data:
  ENVIRONMENT: production
  EXPOSE_DOCS: "false"
  CHROMA_PATH: /app/data/chroma
  SESSION_DATABASE_PATH: /app/data/sessions.db
  OBJECT_STORAGE_PATH: /app/data/objects
  REQUESTS_PER_MINUTE: "60"
  MAX_UPLOAD_MB: "12"
  MAX_PDF_PAGES: "250"
  MAX_DOCUMENT_CHARACTERS: "2000000"
  MAX_DOCUMENT_CHUNKS: "2000"
  OPENAI_TIMEOUT_SECONDS: "30"
  OPENAI_MAX_RETRIES: "2"
  LLM_MAX_OUTPUT_TOKENS: "1800"
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
