[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-career-copilot"
version = "3.0.0"
description = "Grounded AI career coaching, document RAG and interview preparation API"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mateusz Zatylny" }]
dependencies = [
  "chromadb>=0.5,<2",
  "fastapi>=0.115,<1",
  "openai>=1.40,<3",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "prometheus-client>=0.20,<1",
  "pypdf>=4.2,<7",
  "python-dotenv>=1.2.2,<2",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.7,<2",
  "httpx>=0.27,<1",
  "pip-audit>=2.7,<3",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1",
]
loadtest = [
  "locust>=2.31,<3",
]
observability = [
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
  "opentelemetry-instrumentation-fastapi>=0.48b0,<1",
  "opentelemetry-sdk>=1.27,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.report]
fail_under = 75
