[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-career-copilot"
version = "2.1.0"
description = "Grounded AI career coaching, document RAG and interview preparation API"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mateusz Zatylny" }]
dependencies = [
  "chromadb>=0.5,<2",
  "fastapi>=0.115,<1",
  "openai>=1.40,<3",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "pypdf>=4.2,<7",
  "python-dotenv>=1.0.1,<2",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.2,<9",
  "ruff>=0.5,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
